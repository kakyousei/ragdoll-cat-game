<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>布偶猫养成记 · Ragdoll Cat</title>
<style>
  :root{
    --pink:#ffb7c9; --pink-deep:#ff8fab; --cream:#fff6ec; --brown:#8a5a44;
    --ink:#4a3428; --card:#ffffff; --shadow:0 10px 30px rgba(138,90,68,.18);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(160deg,#ffeef4 0%,#fff6ec 55%,#e8f4ff 100%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:18px 12px 40px;
  }
  header{text-align:center; margin-bottom:10px;}
  header h1{margin:4px 0 2px; font-size:clamp(24px,5vw,36px); letter-spacing:1px;}
  header p{margin:0; opacity:.75; font-size:14px;}
  .langSwitch{display:flex; gap:6px; justify-content:center; margin-top:10px;}
  .langSwitch button{border:2px solid #ffd3e0; background:#fff; border-radius:999px; padding:4px 16px;
    font-size:13.5px; font-weight:700; cursor:pointer; color:var(--ink);}
  .langSwitch button.active{background:var(--pink-deep); color:#fff; border-color:var(--pink-deep);}
  .wrap{width:min(960px,100%); display:grid; grid-template-columns:1.15fr .85fr; gap:16px;}
  @media (max-width:760px){ .wrap{grid-template-columns:1fr;} }
  .card{background:var(--card); border-radius:22px; box-shadow:var(--shadow); padding:18px;}
  /* ---------- stage ---------- */
  .stage{
    position:relative; border-radius:18px; overflow:hidden; text-align:center;
    background:linear-gradient(180deg,#cfeaff 0%,#eaf7ff 55%,#ffe9d6 55.2%,#ffd9b8 100%);
    padding:14px 8px 8px; min-height:340px;
  }
  .sun{position:absolute; top:14px; right:16px; width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 40% 40%,#fff3b0,#ffd93b); box-shadow:0 0 24px #ffe66d;}
  .cloud{position:absolute; background:#fff; border-radius:999px; opacity:.9; height:22px;}
  .cloud::before,.cloud::after{content:""; position:absolute; background:#fff; border-radius:50%;}
  .cloud.c1{width:84px; top:26px; left:18px;}
  .cloud.c1::before{width:36px;height:36px;top:-16px;left:12px;}
  .cloud.c1::after{width:26px;height:26px;top:-10px;left:44px;}
  .cloud.c2{width:60px; top:74px; left:64%;}
  .cloud.c2::before{width:26px;height:26px;top:-12px;left:10px;}
  .cloud.c2::after{width:20px;height:20px;top:-8px;left:34px;}
  .rug{position:absolute; left:50%; bottom:26px; transform:translateX(-50%);
    width:270px; height:56px; border-radius:50%; background:radial-gradient(ellipse at center,#ffc2d4,#ff9ebb);}
  #catBox{position:relative; width:min(300px,88%); margin:56px auto 0; cursor:pointer; user-select:none;}
  #catPhoto{width:100%; height:330px; object-fit:cover; display:block; border-radius:18px;
    border:5px solid #fff; box-shadow:0 10px 24px rgba(90,50,30,.28); transition:opacity .18s ease;}
  .thumbs{display:flex; gap:8px; justify-content:center; margin-top:10px;}
  .thumbs button{border:3px solid transparent; border-radius:14px; padding:0; overflow:hidden; cursor:pointer; background:none; line-height:0;}
  .thumbs button.active{border-color:var(--pink-deep);}
  .thumbs img{width:54px; height:54px; object-fit:cover; display:block;}
  .bounce{animation:bounce .5s ease;}
  @keyframes bounce{0%{transform:translateY(0)}35%{transform:translateY(-16px)}100%{transform:translateY(0)}}
  .zzz{position:absolute; top:6px; right:34px; font-size:22px; color:#7aa7ff; opacity:0; font-weight:700; z-index:2;}
  .sleeping .zzz{opacity:1; animation:floatUp 2.2s ease-in-out infinite;}
  @keyframes floatUp{0%{transform:translateY(6px);opacity:0}30%{opacity:1}100%{transform:translateY(-18px);opacity:0}}
  .heart{position:absolute; font-size:22px; pointer-events:none; animation:heartUp 1.4s ease-out forwards;}
  @keyframes heartUp{from{transform:translateY(0) scale(.7);opacity:0}25%{opacity:1}to{transform:translateY(-90px) scale(1.25);opacity:0}}
  .speech{
    margin:10px auto 4px; background:#fff; border:2px solid #ffd3e0; color:var(--ink);
    display:inline-block; padding:8px 16px; border-radius:999px; font-size:15px; min-height:20px;
    box-shadow:0 4px 12px rgba(255,143,171,.25);
  }
  .nameRow{display:flex; gap:8px; justify-content:center; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .nameRow input{font-size:16px; padding:6px 10px; border-radius:10px; border:2px solid #ffd3e0; width:130px; text-align:center;}
  .stageLabel{font-weight:700; color:var(--brown);}
  /* ---------- stats ---------- */
  .stats{display:grid; gap:10px;}
  .stat{display:grid; grid-template-columns:86px 1fr 34px; align-items:center; gap:8px; font-size:14px;}
  .bar{height:14px; background:#f3e4da; border-radius:999px; overflow:hidden;}
  .bar > div{height:100%; border-radius:999px; transition:width .5s ease;}
  .fill-hunger{background:linear-gradient(90deg,#ffb35c,#ff8a5c);}
  .fill-happy{background:linear-gradient(90deg,#ff8fab,#ff5d8f);}
  .fill-energy{background:linear-gradient(90deg,#ffd93b,#ffb703);}
  .fill-clean{background:linear-gradient(90deg,#6ee7ff,#38b6ff);}
  .fill-love{background:linear-gradient(90deg,#d18bff,#9d4edd);}
  .meta{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px;}
  .chip{background:#fff0f5; border:1.5px solid #ffd3e0; padding:5px 12px; border-radius:999px; font-size:14px; font-weight:600;}
  /* ---------- actions ---------- */
  .actions{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px;}
  @media (max-width:480px){ .actions{grid-template-columns:repeat(2,1fr);} }
  button.act{
    border:none; cursor:pointer; border-radius:16px; padding:12px 6px; font-size:16px; font-weight:700;
    background:linear-gradient(180deg,#fff,#ffeef4); color:var(--ink);
    box-shadow:0 4px 0 #ffc2d4, 0 8px 16px rgba(138,90,68,.12); transition:transform .08s, box-shadow .08s;
  }
  button.act:active{transform:translateY(3px); box-shadow:0 1px 0 #ffc2d4;}
  button.act small{display:block; font-weight:500; font-size:12px; opacity:.72; margin-top:3px;}
  button.act:disabled{opacity:.45; cursor:not-allowed;}
  .shop{margin-top:14px;}
  .shop h3,.diary h3{margin:4px 0 8px; font-size:16px;}
  .foods{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  button.food{
    border:2px solid #ffe1c7; background:#fffaf3; border-radius:14px; padding:9px 4px; cursor:pointer;
    font-size:14px; font-weight:600; color:var(--ink);
  }
  button.food small{display:block; font-size:12px; opacity:.7; font-weight:500; margin-top:2px;}
  button.food:disabled{opacity:.45; cursor:not-allowed;}
  .diary{
    margin-top:14px; background:#fffaf0; border:1.5px dashed #e8c39e; border-radius:14px; padding:10px 14px;
    font-size:13.5px; line-height:1.75; max-height:170px; overflow:auto;
  }
  .diary p{margin:0;}
  .reset{margin-top:12px; text-align:right;}
  .reset button{background:none; border:none; color:#b08a72; cursor:pointer; font-size:12.5px; text-decoration:underline;}
  footer{margin-top:18px; font-size:12.5px; opacity:.6; text-align:center;}
</style>
</head>

        <button data-photo="play"><img src="" data-photo="play" alt=""></button>
        <button data-photo="sleep"><img src="" data-photo="sleep" alt=""></button>
      </div>
    </div>

    <div class="actions">

      <button class="act" id="btnPlay">🧶 <span data-i18n="play">玩耍</span><small data-i18n="playSub">快乐 +14 · 精力 -10</small></button>

      <button class="act" id="btnGroom">🪮 <span data-i18n="groom">梳毛</span><small data-i18n="groomSub">清洁 +8 · 亲密 +4</small></button>
      <button class="act" id="btnSleep">🌙 <span data-i18n="sleep">睡觉</span><small data-i18n="sleepSub">精力 +30</small></button>
      <button class="act" id="btnWork">🎁 <span data-i18n="work">卖萌打工</span><small data-i18n="workSub">金币 +12</small></button>
    </div>
  </div>

  <!-- right: stats -->
  <div class="card">
    <div class="stats">
      <div class="stat"><span>🍚 <span data-i18n="stHunger">饱食</span></span><div class="bar"><div class="fill-hunger" id="barHunger"></div></div><b id="vHunger"></b></div>
      <div class="stat"><span>😊 <span data-i18n="stHappy">快乐</span></span><div class="bar"><div class="fill-happy" id="barHappy"></div></div><b id="vHappy"></b></div>
      <div class="stat"><span>⚡ <span data-i18n="stEnergy">精力</span></span><div class="bar"><div class="fill-energy" id="barEnergy"></div></div><b id="vEnergy"></b></div>
      <div class="stat"><span>🫧 <span data-i18n="stClean">清洁</span></span><div class="bar"><div class="fill-clean" id="barClean"></div></div><b id="vClean"></b></div>
      <div class="stat"><span>💗 <span data-i18n="stLove">亲密</span></span><div class="bar"><div class="fill-love" id="barLove"></div></div><b id="vLove"></b></div>
    </div>
    <div class="meta">
      <span class="chip">🪙 <span data-i18n="coins">金币</span> <span id="vCoins"></span></span>
      <span class="chip">📅 <span data-i18n="dayPre">第</span> <span id="vDay"></span> <span data-i18n="dayPost">天</span></span>
      <span class="chip">⭐ <span id="vStage"></span></span>
      <span class="chip">🏅 <span data-i18n="growth">成长值</span> <span id="vGrowth"></span></span>
    </div>

    <div class="shop">
      <h3 data-i18n="shop">🍽️ 小食堂（用金币买好吃的）</h3>
      <div class="foods">
        <button class="food" data-food="food"><span class="fname"></span><small class="fdesc"></small></button>
        <button class="food" data-food="can"><span class="fname"></span><small class="fdesc"></small></button>
        <button class="food" data-food="fish"><span class="fname"></span><small class="fdesc"></small></button>
      </div>
    </div>

    <div class="diary">
      <h3 data-i18n="diary">📖 养成日记</h3>
      <div id="diary"></div>
    </div>
    <div class="reset"><button id="btnReset" data-i18n="reset">重新领养一只</button></div>
  </div>
</div>

<footer data-i18n="footer">进度会自动保存在这台设备的浏览器里 · 用心陪伴，小猫会慢慢长大</footer>

  function setPhoto(k){
    if(!PHOTOS[k]) return;

      curPhoto=k;
      var img=$("catPhoto");
      img.style.opacity=0;
      setTimeout(function(){
        img.onload=function(){ img.style.opacity=1; };

        setTimeout(function(){ img.style.opacity=1; },400);
      },180);
    }
    markThumbs();
  }
  function markThumbs(){

    var foods=document.querySelectorAll("button.food");
    for(var i=0;i<foods.length;i++){
      foods[i].disabled = S.coins < FOODS[foods[i].getAttribute("data-food")].cost;
    }
    save();
  }
  function applyLang(){
    T = I18N[LANG];
    document.title = T.docTitle;
    document.documentElement.lang = (LANG==="zh" ? "zh-CN" : LANG);
    var els=document.querySelectorAll("[data-i18n]");
    for(var i=0;i<els.length;i++){
      var key=els[i].getAttribute("data-i18n");
      if(T[key]) els[i].textContent=T[key];
    }
    var lb=document.querySelectorAll("#langSwitch button");
    for(var j=0;j<lb.length;j++) lb[j].classList.toggle("active", lb[j].getAttribute("data-lang")===LANG);
    var fb=document.querySelectorAll("button.food");
    for(var f=0;f<fb.length;f++){
      var fd=T.foods[fb[f].getAttribute("data-food")];
      fb[f].querySelector(".fname").textContent=fd.name;
      fb[f].querySelector(".fdesc").textContent=fd.desc;
    }
    $("catPhoto").alt=T.catAlt;
    var tb=document.querySelectorAll("#thumbs button");
    for(var t=0;t<tb.length;t++) tb[t].title=T.thumbTitles[t] || "";
    render();
  }
  var langBtns=document.querySelectorAll("#langSwitch button");
  for(var li=0;li<langBtns.length;li++){
    langBtns[li].onclick=function(){
      LANG=this.getAttribute("data-lang");
      try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
      applyLang();
      say(T.hello);
    };
  }
  function grow(n){
    var before=stageIdx(); S.growth+=n;
    if(stageIdx()!==before){
      say(fmt(T.grewSay, {name:S.name, stage:T.stages[stageIdx()].name}));
      log(fmt(T.logGrew, {stage:T.stages[stageIdx()].name})); hearts(6); bounce();
    }
  }
  function wakeCheck(action){
    if(S.sleeping && action!=="sleep"){
      S.sleeping=false; setPhoto("main"); say(T.wake); render();
    }
  }

  /* ---------- actions ---------- */
  $("btnPet").onclick=function(){
    wakeCheck("pet"); setPhoto("main"); S.love=clamp(S.love+6); S.happy=clamp(S.happy+4);
    grow(2); hearts(3); bounce(); say(fmt(T.petSay, {name:S.name})); log(T.logPet); render();
  };
  $("btnPlay").onclick=function(){
    wakeCheck("play"); setPhoto("play");
    if(S.energy<10){ say(T.playTired); return; }
    S.happy=clamp(S.happy+14); S.energy=clamp(S.energy-10); S.hunger=clamp(S.hunger-4); S.love=clamp(S.love+3);
    grow(5); hearts(2); bounce(); say(T.playSay); log(T.logPlay); render();
  };
  $("btnBath").onclick=function(){
    wakeCheck("bath"); setPhoto("main"); S.clean=clamp(100); S.happy=clamp(S.happy-4); S.energy=clamp(S.energy-6);
    grow(3); say(T.bathSay); log(T.logBath); render();
  };
  $("btnGroom").onclick=function(){
    wakeCheck("groom"); setPhoto("main"); S.clean=clamp(S.clean+8); S.love=clamp(S.love+4); S.happy=clamp(S.happy+3);
    grow(2); hearts(1); say(T.groomSay); log(T.logGroom); render();
  };
  $("btnSleep").onclick=function(){
    S.sleeping=!S.sleeping;
    if(S.sleeping){ say(T.sleepOnSay); log(T.logSleepOn); }
    else { S.energy=clamp(S.energy+30); setPhoto("main"); say(T.sleepOffSay); log(T.logSleepOff); }
    render();
  };
  $("btnWork").onclick=function(){
    wakeCheck("work"); setPhoto("main");
    if(S.energy<8){ say(T.workTired); return; }
    S.energy=clamp(S.energy-8); S.coins+=12; S.happy=clamp(S.happy+2);
    grow(2); hearts(2); bounce(); say(T.workSay); log(T.logWork); render();
  };
  catBox.onclick=function(){ $("btnPet").onclick(); };

  var thumbBtns=document.querySelectorAll("#thumbs button");
  for(var t2=0;t2<thumbBtns.length;t2++){
    thumbBtns[t2].onclick=function(){ setPhoto(this.getAttribute("data-photo")); };
  }

  var foodBtns=document.querySelectorAll("button.food");
  for(var i2=0;i2<foodBtns.length;i2++){
    foodBtns[i2].onclick=function(){
      var key=this.getAttribute("data-food");
      var f=FOODS[key], fd=T.foods[key];
      if(S.coins<f.cost){ say(T.noCoins); return; }
      wakeCheck("feed"); setPhoto("main"); S.coins-=f.cost;
      S.hunger=clamp(S.hunger+f.hunger); S.happy=clamp(S.happy+f.happy); S.love=clamp(S.love+f.love);
      grow(3); bounce(); say(fd.say); log(fmt(T.logFeed, {food:fd.name})); render();
    };
  }
  $("nameInput").addEventListener("change", function(){
    var v=this.value.trim(); if(v){ S.name=v; say(fmt(T.renameSay, {name:v})); log(fmt(T.logRename, {name:v})); render(); }
  });
  $("btnReset").onclick=function(){
    if(confirm(T.confirmReset)){
      S=fresh(); diaryEl.innerHTML=""; say(T.hello); log(T.logNew); render();
    }
  };

  /* ---------- ambient life: time passing ---------- */
  setInterval(function(){
    S.ticks+=1;
    if(S.sleeping){ S.energy=clamp(S.energy+4); }
    else{
      S.hunger=clamp(S.hunger-2); S.happy=clamp(S.happy-1);
      S.clean=clamp(S.clean-1); S.energy=clamp(S.energy-1);
    }
    if(S.ticks%6===0){ S.day+=1; log(T.logNewDay); }
    if(S.ticks%5===0 && !S.sleeping) say(T.events[Math.floor(Math.random()*T.events.length)]);
    if(S.hunger<=15) say(T.hungry);
    else if(S.clean<=15) say(T.dirty);
    else if(S.energy<=12 && !S.sleeping) say(T.sleepy);
    render();
  },8000);

  applyLang();
  say(T.hello);
  log(fmt(T.logAdopt, {name:S.name}));
  render();
})();
</script>
</body>
</html>
